<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <rect width="1000" height="760" fill="#1e1e1e"/>
  <g font-family="Consolas, 'Cascadia Code', 'SF Mono', monospace" font-size="14" xml:space="preserve">
    <text x="20" y="30"><tspan fill="#4ec9b0">TArray</tspan><tspan fill="#d4d4d4">&lt;</tspan><tspan fill="#4ec9b0">int32</tspan><tspan fill="#d4d4d4">&gt; </tspan><tspan fill="#4ec9b0">AChunk</tspan><tspan fill="#d4d4d4">::</tspan><tspan fill="#dcdcaa">CalculateNoise</tspan><tspan fill="#d4d4d4">()</tspan></text>
    <text x="20" y="50"><tspan fill="#d4d4d4">{</tspan></text>
    <text x="44" y="70"><tspan fill="#4ec9b0">TArray</tspan><tspan fill="#d4d4d4">&lt;</tspan><tspan fill="#4ec9b0">int32</tspan><tspan fill="#d4d4d4">&gt; </tspan><tspan fill="#9cdcfe">noiseArray</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="44" y="90"><tspan fill="#9cdcfe">noiseArray</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">SetNum</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#9cdcfe">_chunkXYSizeP2</tspan><tspan fill="#d4d4d4">);</tspan></text>
    <text x="44" y="130"><tspan fill="#569cd6">float</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">xNoiseMult</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0.0f</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="44" y="150"><tspan fill="#569cd6">float</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">yNoiseMult</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0.0f</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="44" y="170"><tspan fill="#4ec9b0">int32</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">val</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0.0f</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="44" y="210"><tspan fill="#569cd6">for</tspan><tspan fill="#d4d4d4"> (</tspan><tspan fill="#569cd6">int</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">x</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#d4d4d4">; </tspan><tspan fill="#9cdcfe">x</tspan><tspan fill="#d4d4d4"> &lt; </tspan><tspan fill="#9cdcfe">_csp</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#9cdcfe">_chunkXYSize</tspan><tspan fill="#d4d4d4">; </tspan><tspan fill="#9cdcfe">x</tspan><tspan fill="#d4d4d4">++)</tspan></text>
    <text x="44" y="230"><tspan fill="#d4d4d4">{</tspan></text>
    <text x="68" y="250"><tspan fill="#569cd6">for</tspan><tspan fill="#d4d4d4"> (</tspan><tspan fill="#569cd6">int</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">y</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#d4d4d4">; </tspan><tspan fill="#9cdcfe">y</tspan><tspan fill="#d4d4d4"> &lt; </tspan><tspan fill="#9cdcfe">_csp</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#9cdcfe">_chunkXYSize</tspan><tspan fill="#d4d4d4">; </tspan><tspan fill="#9cdcfe">y</tspan><tspan fill="#d4d4d4">++)</tspan></text>
    <text x="68" y="270"><tspan fill="#d4d4d4">{</tspan></text>
    <text x="92" y="290"><tspan fill="#569cd6">float</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">cumulativeNoiseValue</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0.0f</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="92" y="330"><tspan fill="#569cd6">for</tspan><tspan fill="#d4d4d4"> (</tspan><tspan fill="#569cd6">int</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#d4d4d4">; </tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4"> &lt; </tspan><tspan fill="#9cdcfe">_octaves</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">Num</tspan><tspan fill="#d4d4d4">(); </tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4">++)</tspan></text>
    <text x="92" y="350"><tspan fill="#d4d4d4">{</tspan></text>
    <text x="116" y="370"><tspan fill="#569cd6">if</tspan><tspan fill="#d4d4d4"> (</tspan><tspan fill="#9cdcfe">_octaves</tspan><tspan fill="#d4d4d4">[</tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4">].</tspan><tspan fill="#9cdcfe">_skip</tspan><tspan fill="#d4d4d4">) </tspan><tspan fill="#569cd6">continue</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="116" y="390"><tspan fill="#569cd6">float</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">noiseValue</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">0.0f</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="116" y="410"><tspan fill="#9cdcfe">xNoiseMult</tspan><tspan fill="#d4d4d4"> = (((</tspan><tspan fill="#9cdcfe">_chunkXIndex</tspan><tspan fill="#d4d4d4"> + </tspan><tspan fill="#9cdcfe">_csp</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#9cdcfe">_randomSeed</tspan><tspan fill="#d4d4d4">) * </tspan><tspan fill="#9cdcfe">_csp</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#9cdcfe">_chunkXYSize</tspan><tspan fill="#d4d4d4">) + </tspan><tspan fill="#9cdcfe">x</tspan><tspan fill="#d4d4d4">) * </tspan><tspan fill="#9cdcfe">_octaves</tspan><tspan fill="#d4d4d4">[</tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4">].</tspan><tspan fill="#9cdcfe">_xMult</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="116" y="430"><tspan fill="#9cdcfe">yNoiseMult</tspan><tspan fill="#d4d4d4"> = (((</tspan><tspan fill="#9cdcfe">_chunkYIndex</tspan><tspan fill="#d4d4d4"> + </tspan><tspan fill="#9cdcfe">_csp</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#9cdcfe">_randomSeed</tspan><tspan fill="#d4d4d4">) * </tspan><tspan fill="#9cdcfe">_csp</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#9cdcfe">_chunkXYSize</tspan><tspan fill="#d4d4d4">) + </tspan><tspan fill="#9cdcfe">y</tspan><tspan fill="#d4d4d4">) * </tspan><tspan fill="#9cdcfe">_octaves</tspan><tspan fill="#d4d4d4">[</tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4">].</tspan><tspan fill="#9cdcfe">_yMult</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="116" y="450"><tspan fill="#9cdcfe">noiseValue</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#4ec9b0">USimplexNoiseBPLibrary</tspan><tspan fill="#d4d4d4">::</tspan><tspan fill="#dcdcaa">SimplexNoise2D</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#9cdcfe">xNoiseMult</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#9cdcfe">yNoiseMult</tspan><tspan fill="#d4d4d4">);</tspan></text>
    <text x="116" y="470"><tspan fill="#9cdcfe">noiseValue</tspan><tspan fill="#d4d4d4"> *= </tspan><tspan fill="#9cdcfe">_octaves</tspan><tspan fill="#d4d4d4">[</tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4">].</tspan><tspan fill="#9cdcfe">_weight</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="116" y="490"><tspan fill="#569cd6">if</tspan><tspan fill="#d4d4d4"> (</tspan><tspan fill="#9cdcfe">_octaves</tspan><tspan fill="#d4d4d4">[</tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4">].</tspan><tspan fill="#9cdcfe">_clamp</tspan><tspan fill="#d4d4d4">)</tspan></text>
    <text x="116" y="510"><tspan fill="#d4d4d4">{</tspan></text>
    <text x="140" y="530"><tspan fill="#9cdcfe">noiseValue</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#4ec9b0">FMath</tspan><tspan fill="#d4d4d4">::</tspan><tspan fill="#dcdcaa">Clamp</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#9cdcfe">noiseValue</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#9cdcfe">_octaves</tspan><tspan fill="#d4d4d4">[</tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4">].</tspan><tspan fill="#9cdcfe">_clampMin</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#9cdcfe">_octaves</tspan><tspan fill="#d4d4d4">[</tspan><tspan fill="#9cdcfe">o</tspan><tspan fill="#d4d4d4">].</tspan><tspan fill="#9cdcfe">_clampMax</tspan><tspan fill="#d4d4d4">);</tspan></text>
    <text x="116" y="550"><tspan fill="#d4d4d4">}</tspan></text>
    <text x="116" y="570"><tspan fill="#9cdcfe">cumulativeNoiseValue</tspan><tspan fill="#d4d4d4"> += </tspan><tspan fill="#9cdcfe">noiseValue</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="92" y="590"><tspan fill="#d4d4d4">}</tspan></text>
    <text x="92" y="630"><tspan fill="#9cdcfe">val</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#4ec9b0">FMath</tspan><tspan fill="#d4d4d4">::</tspan><tspan fill="#dcdcaa">FloorToInt</tspan><tspan fill="#d4d4d4">((</tspan><tspan fill="#9cdcfe">cumulativeNoiseValue</tspan><tspan fill="#d4d4d4">));</tspan></text>
    <text x="92" y="650"><tspan fill="#9cdcfe">noiseArray</tspan><tspan fill="#d4d4d4">[</tspan><tspan fill="#9cdcfe">x</tspan><tspan fill="#d4d4d4"> + (</tspan><tspan fill="#9cdcfe">y</tspan><tspan fill="#d4d4d4"> * </tspan><tspan fill="#9cdcfe">_csp</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#9cdcfe">_chunkXYSize</tspan><tspan fill="#d4d4d4">)] = </tspan><tspan fill="#9cdcfe">val</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="68" y="670"><tspan fill="#d4d4d4">}</tspan></text>
    <text x="44" y="690"><tspan fill="#d4d4d4">}</tspan></text>
    <text x="44" y="710"><tspan fill="#569cd6">return</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">noiseArray</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="20" y="730"><tspan fill="#d4d4d4">}</tspan></text>
  </g>
</svg>
